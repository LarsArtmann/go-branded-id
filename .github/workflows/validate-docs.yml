name: Validate Docs

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  validate-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # md-go-validator@latest requires go >= 1.27; 1.27 also matches the
          # linter-module pin, so the check-go-pins tripwire stays satisfied.
          go-version: "1.27"

      - name: Install md-go-validator
        run: go install github.com/larsartmann/md-go-validator/cmd/md-go-validator@latest

      - name: Validate code blocks
        run: md-go-validator -f json -o results.json .

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-results
          path: results.json
