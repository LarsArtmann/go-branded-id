name: Go

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [v1, v2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build (json ${{ matrix.mode }})
        run: go build ./...
        env:
          GOEXPERIMENT: ${{ matrix.mode == 'v2' && 'jsonv2' || '' }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [v1, v2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Test (json ${{ matrix.mode }})
        run: go test ./... -race -count=1 -cover
        env:
          GOEXPERIMENT: ${{ matrix.mode == 'v2' && 'jsonv2' || '' }}

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v1 lints the default (encoding/json) code paths; v2 lints the
        # GOEXPERIMENT=jsonv2 code paths via build tags. Both file pairs are
        # mutually exclusive, so both modes are required for full coverage.
        mode: [v1, v2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: golangci-lint (json ${{ matrix.mode }})
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: ${{ matrix.mode == 'v2' && '--build-tags goexperiment.jsonv2' || '' }}
