name: Go

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  hygiene:
    # Fails if a compiled binary or other build artifact is tracked at repo
    # root — recurrence guard for the v0.5.0 incident where a tracked `namer`
    # binary inflated release source archives ~10x.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject tracked build artifacts
        run: |
          offenders=$(git ls-files | grep -v / | xargs -r file --mime-type \
            | grep -E 'application/(x-executable|x-sharedlib|x-mach-binary|octet-stream)' \
            | cut -d: -f1 || true)
          if [ -n "$offenders" ]; then
            echo "::error::Tracked build artifacts at repo root:"
            echo "$offenders"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [v1, v2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Build (json ${{ matrix.mode }})
        run: go build ./...
        env:
          GOEXPERIMENT: ${{ matrix.mode == 'v2' && 'jsonv2' || '' }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [v1, v2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Test (json ${{ matrix.mode }})
        run: go test ./... -race -count=1 -cover
        env:
          GOEXPERIMENT: ${{ matrix.mode == 'v2' && 'jsonv2' || '' }}

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v1 lints the default (encoding/json) code paths; v2 lints the
        # GOEXPERIMENT=jsonv2 code paths via build tags. Both file pairs are
        # mutually exclusive, so both modes are required for full coverage.
        mode: [v1, v2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: golangci-lint (json ${{ matrix.mode }})
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: ${{ matrix.mode == 'v2' && '--build-tags goexperiment.jsonv2' || '' }}

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: nix flake check
        run: |
          nix flake check --all-systems --no-build
          nix flake check
