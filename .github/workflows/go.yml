name: Go

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [v1, v2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - name: Build (json ${{ matrix.mode }})
        run: go build ./...
        env:
          GOEXPERIMENT: ${{ matrix.mode == 'v2' && 'jsonv2' || '' }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [v1, v2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - name: Test (json ${{ matrix.mode }})
        run: go test ./... -race -count=1 -cover
        env:
          GOEXPERIMENT: ${{ matrix.mode == 'v2' && 'jsonv2' || '' }}

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v1 lints the default (encoding/json) code paths; v2 lints the
        # GOEXPERIMENT=jsonv2 code paths via build tags. Both file pairs are
        # mutually exclusive, so both modes are required for full coverage.
        mode: [v1, v2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - name: golangci-lint (json ${{ matrix.mode }})
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: latest
          args: ${{ matrix.mode == 'v2' && '--build-tags goexperiment.jsonv2' || '' }}

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17

      - name: nix flake check
        run: nix flake check --all-systems
