name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [v1, v2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build (json ${{ matrix.mode }})
        run: go build ./...
        env:
          GOEXPERIMENT: ${{ matrix.mode == 'v2' && 'jsonv2' || '' }}

      - name: Test (json ${{ matrix.mode }})
        run: go test -race ./...
        env:
          GOEXPERIMENT: ${{ matrix.mode == 'v2' && 'jsonv2' || '' }}

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [v1, v2]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint (json ${{ matrix.mode }})
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: ${{ matrix.mode == 'v2' && '--build-tags goexperiment.jsonv2 --timeout=5m' || '--timeout=5m' }}

  release:
    runs-on: ubuntu-latest
    needs: [verify, lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
