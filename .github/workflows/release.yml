name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "linter/v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/linter/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [v1, v2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: Build (json ${{ matrix.mode }})
        run: go build ./...
        env:
          GOEXPERIMENT: ${{ matrix.mode == 'v2' && 'jsonv2' || '' }}

      - name: Test (json ${{ matrix.mode }})
        run: go test -race ./...
        env:
          GOEXPERIMENT: ${{ matrix.mode == 'v2' && 'jsonv2' || '' }}

  lint:
    if: ${{ !startsWith(github.ref, 'refs/tags/linter/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [v1, v2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint (json ${{ matrix.mode }})
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: ${{ matrix.mode == 'v2' && '--build-tags goexperiment.jsonv2 --timeout=5m' || '--timeout=5m' }}

  linter-verify:
    # The linter/ sub-module releases as linter/vX.Y.Z tags; verify it on its
    # own Go floor when such a tag is pushed.
    if: ${{ startsWith(github.ref, 'refs/tags/linter/') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: linter/go.sum

      - name: Build
        run: go build ./...
        env:
          GOTOOLCHAIN: local

      - name: Test
        run: go test -race ./...
        env:
          GOTOOLCHAIN: local

  release:
    runs-on: ubuntu-latest
    needs: [verify, lint, linter-verify]
    # Exactly one of (verify+lint) / linter-verify runs per tag; a skipped
    # needed job would otherwise skip this job too (GitHub treats skipped
    # needs as neither success nor failure), so gate on no failures instead.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract CHANGELOG section for this version
        run: |
          if [[ "$GITHUB_REF_NAME" == linter/* ]]; then
            CHANGELOG_FILE="linter/CHANGELOG.md"
            VERSION="${GITHUB_REF_NAME#linter/v}"
          else
            CHANGELOG_FILE="CHANGELOG.md"
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          awk -v header="## [${VERSION}]" '
            index($0, header) == 1 { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' "$CHANGELOG_FILE" > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "_No CHANGELOG section found for ${GITHUB_REF_NAME} — see [${CHANGELOG_FILE}](https://github.com/${GITHUB_REPOSITORY}/blob/master/${CHANGELOG_FILE})._" > /tmp/release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
